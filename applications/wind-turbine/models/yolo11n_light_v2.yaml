# YOLOv11n-Light v2: 轻量化版本
# 改进点: 减少部分 C3k2 的 repeat 次数 (depth 缩放)
# Backbone 保持相同通道宽度，仅减少计算量
# 参数量减少约 15-20%，同时保持预训练权重兼容

nc: 2
scales:
  n: [0.50, 0.25, 1024]

# Backbone (减少 C3k2 深度)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 1, C3k2, [256, False, 0.25]]  # 减少: repeat 2→1
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 1, C3k2, [512, False, 0.25]]  # 减少: repeat 2→1
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 1, C3k2, [512, True]]     # 减少: repeat 2→1
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 1, C3k2, [1024, True]]    # 减少: repeat 2→1
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 2, C2PSA, [1024]]         # 10

# Head (与标准 YOLOv11n 一致)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, False]]    # 减少: repeat 2→1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, False]]    # 减少: repeat 2→1

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, False]]    # 减少: repeat 2→1

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True]]    # 减少: repeat 2→1

  - [[16, 19, 22], 1, Detect, [nc]]
