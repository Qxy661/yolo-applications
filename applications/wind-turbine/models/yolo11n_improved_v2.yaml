# YOLOv11n-Improved v2: 综合改进版本
# 组合两项改进: 增强C2PSA注意力 + BiFPN特征融合
# Backbone 与标准 YOLOv11n 完全一致

nc: 2
scales:
  n: [0.50, 0.25, 1024]

# Backbone (与标准 YOLOv11n 完全一致)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 4, C2PSA, [1024]]         # 10 - 增强: repeat 4

# BiFPN Head + 增强注意力
head:
  # Top-down pathway
  - [-1, 1, Conv, [128, 1, 1]]     # 11 - P5 降维
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]       # cat backbone P4
  - [-1, 2, C3k2, [128, False]]     # 14 - P4 融合

  - [-1, 1, Conv, [64, 1, 1]]      # 15 - P4 降维
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]       # cat backbone P3
  - [-1, 2, C3k2, [64, False]]      # 18 - P3 融合 (P3/8-small)

  # Bottom-up pathway
  - [-1, 1, Conv, [128, 3, 2]]     # 19 - P3 升维
  - [[-1, 14], 1, Concat, [1]]      # cat P4 融合
  - [-1, 2, C3k2, [128, False]]     # 21 - P4 融合 (P4/16-medium)

  - [-1, 1, Conv, [256, 3, 2]]     # 22 - P4 升维
  - [[-1, 11], 1, Concat, [1]]      # cat P5
  - [-1, 2, C3k2, [256, True]]      # 24 - P5 融合 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]]
