# YOLOv11n-BiFPN v2: 双向特征融合版本
# 改进点: 替换 PANet 为 BiFPN (加权双向特征金字塔)
# Backbone 与标准 YOLOv11n 完全一致，仅替换 Head
# BiFPN 增加跨尺度连接，提升多尺度特征融合能力

nc: 2
scales:
  n: [0.50, 0.25, 1024]

# Backbone (与标准 YOLOv11n 完全一致)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 2, C2PSA, [1024]]         # 10

# BiFPN Head (双向特征融合)
# P3=layer4(64ch), P4=layer6(128ch), P5=layer10(256ch)
head:
  # Top-down pathway (P5→P4→P3)
  - [-1, 1, Conv, [128, 1, 1]]     # 11 - P5 降维到 128
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]       # cat backbone P4 (128ch)
  - [-1, 2, C3k2, [128, False]]     # 14 - P4 融合

  - [-1, 1, Conv, [64, 1, 1]]      # 15 - P4 降维到 64
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]       # cat backbone P3 (64ch)
  - [-1, 2, C3k2, [64, False]]      # 18 - P3 融合 (P3/8-small)

  # Bottom-up pathway (P3→P4→P5)
  - [-1, 1, Conv, [128, 3, 2]]     # 19 - P3 升维到 128
  - [[-1, 14], 1, Concat, [1]]      # cat P4 融合
  - [-1, 2, C3k2, [128, False]]     # 21 - P4 融合 (P4/16-medium)

  - [-1, 1, Conv, [256, 3, 2]]     # 22 - P4 升维到 256
  - [[-1, 11], 1, Concat, [1]]      # cat P5 降维
  - [-1, 2, C3k2, [256, True]]      # 24 - P5 融合 (P5/32-large)

  # 额外的跨尺度连接 (BiFPN 特性)
  - [[18, 21, 24], 1, Detect, [nc]]
