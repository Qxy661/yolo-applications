# YOLOv11-nano 配置 — 风电叶片缺陷检测
# 基线配置，无额外改进

# 参数
nc: 5
scales:
  n: [0.50, 0.25, 1024]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C3k2, [128, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C3k2, [256, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C3k2, [512]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3k2, [1024]]
  - [-1, 1, SPPF, [1024, 5]]

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C3k2, [1024]]

  - [[15, 18, 21], 1, Detect, [nc]]
