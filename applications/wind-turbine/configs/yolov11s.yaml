# YOLOv11-small 配置 — 风电叶片缺陷检测
# 带CA注意力机制的改进配置

# 参数
nc: 5
scales:
  s: [0.50, 0.25, 1024]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C3k2, [128, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C3k2, [256, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C3k2, [512]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3k2, [1024]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, CA, [1024]]  # 添加CA注意力

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C3k2, [1024]]

  - [[16, 19, 22], 1, Detect, [nc]]
